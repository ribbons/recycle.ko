name: Build & test
on:
  push:
  pull_request:
  schedule:
    - cron: '30 12 * * 5'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - debian:stable-slim
          - ubuntu:24.04
          - ubuntu:26.04
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              gcc linux-headers-generic make
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build
        run: |
          kernelname=$(ls -1 /lib/modules/ | tail -n 1)
          KCFLAGS=-fanalyzer make MODLIB=/lib/modules/$kernelname

  test:
    name: Test
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bats
        run: sudo apt-get install bats

      - name: Build
        run: KCFLAGS='-DUBUNTU_AZURE_KERNEL' make

      - name: Bats tests
        run: ./test.bats

      - name: Large tree test
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./large-tree-test
